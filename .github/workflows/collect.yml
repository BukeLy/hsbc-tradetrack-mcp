name: Collect

on:
  schedule:
    # Every 10 min through the HK (01:30-08:30 UTC) and US (13:30-21:00 UTC, EDT or EST) sessions.
    # Unchanged snapshots are skipped, so polling more often than HSBC refreshes only costs runner time.
    - cron: "*/10 1-8,13-21 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the data branch
      actions: write # re-enable this workflow, see the last step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data-branch
          persist-credentials: false
      # Fails the run when any list could not be fetched: that is the upstream-change alarm.
      - run: python3 scripts/collect.py data-branch
      - name: Push new snapshots
        if: ${{ !cancelled() }}
        working-directory: data-branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data
      # Public repos disable schedules after 60 days without "repository activity", and GitHub does not
      # say whether data-branch pushes count. Re-enabling via the API (the keepalive-workflow approach)
      # refreshes that timer; monthly Dependabot merges on main are the second line.
      - name: Keep schedule alive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml/enable"
